[package]
name = "tasklist-api"
version = "0.1.0"
edition = "2021"
description = "Task list API - Rust (Axum) + MySQL (SQLx)"

[dependencies]
# Web framework + async runtime
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }

# MySQL access.
#
# No TLS backend is enabled by default: a local MySQL connection does not need
# one, and both rustls backends drag in a C toolchain (aws-lc-rs needs CMake +
# NASM, ring needs a C compiler) which makes a fresh `cargo build` fail on
# machines that only have Rust installed. Connecting to a TLS-requiring server
# is one flag away - see the [features] section below.
sqlx = { version = "0.8.3", default-features = false, features = [
    "runtime-tokio",
    "mysql",
    "chrono",
    "macros",
] }

# JSON + dates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# Config + logging + errors
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

[features]
default = []
# Build with TLS support for MySQL connections over an untrusted network:
#     cargo run --features tls
# Requires a C compiler on the build machine (the `ring` crate compiles C).
tls = ["sqlx/tls-rustls-ring"]
